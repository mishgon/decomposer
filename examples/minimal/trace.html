<h1>Beginner Quiz</h1>
<h2>Section 1: Python</h2>
<p><strong>P1 (Concept)</strong> What data type is returned by <code>type(&quot;Hello&quot;)</code>?<br />
A) int  B) float  C) str  D) list<br />
Answer: C<br />
Explanation: Strings are represented by the <code>str</code> type.</p>
<p><strong>P2 (Code snippet)</strong> What is the output?</p>
<pre><code class="language-python">print(5 ** 2)
</code></pre>
<p>A) 10  B) 25  C) 52  D) Error<br />
Answer: B<br />
Explanation: The exponent operator raises 5 to the power of 2.</p>
<p><strong>P3 (Common mistake)</strong> What error does <code>x = int(&quot;abc&quot;)</code> raise?<br />
A) Variable undefined  B) Syntax error  C) TypeError  D) NameError<br />
Answer: C<br />
Explanation: Converting non-numeric strings to integers raises a TypeError.</p>
<h2>Section 2: SQL</h2>
<p><strong>S1 (Concept)</strong> Which command correctly retrieves all columns from a table named <code>products</code>?<br />
A) <code>FROM products</code>  B) <code>SELECT products</code>  C) <code>SELECT * FROM products</code>  D) <code>SELECT FROM products</code><br />
Answer: C<br />
Explanation: <code>SELECT *</code> retrieves all columns, and <code>FROM</code> specifies the table name.</p>
<p><strong>S2 (Concrete example)</strong> Table <code>scores</code> has columns <code>student</code> and <code>mark</code>. Query: <code>SELECT student FROM scores WHERE mark &gt; 80</code>. What is returned?<br />
A) All marks  B) All students  C) Students with marks above 80  D) An error message<br />
Answer: C<br />
Explanation: The <code>WHERE</code> clause filters rows to show only students exceeding the mark threshold.</p>
<p><strong>S3 (Common mistake)</strong> What is the result of <code>SELECT 'Hello' + NULL</code>?<br />
A) Hello  B) NULL  C) Error  D) 'HelloNULL'<br />
Answer: B<br />
Explanation: Any operation involving NULL returns NULL because the value is unknown.</p>
<h2>Section 3: Machine Learning</h2>
<p><strong>M1 (Concept)</strong> What does supervised learning rely on?<br />
A) Random data generation  B) Labeled input-output pairs  C) Clustering algorithms only  D) Reward-based feedback loops<br />
Answer: B<br />
Explanation: Supervised learning requires labeled data to map inputs to correct outputs.</p>
<p><strong>M2 (Concrete example)</strong> A model predicts 5 out of 10 emails as spam correctly. What is the accuracy?<br />
A) 25%  B) 50%  C) 75%  D) 100%<br />
Answer: B<br />
Explanation: Accuracy is calculated by dividing correct predictions by total predictions.</p>
<p><strong>M3 (Common mistake)</strong> Why does a model perform well on training data but poorly on new data?<br />
A) Underfitting  B) Overfitting  C) Data leakage  D) High bias<br />
Answer: B<br />
Explanation: Overfitting happens when the model memorizes training noise instead of learning general patterns.</p>

<script>
const tooltip = document.getElementById("tooltip");
let hideTimer;
function hide() { tooltip.hidden = true; }
function delayHide() { hideTimer = setTimeout(hide, 180); }
function show(event) {
  clearTimeout(hideTimer);
  const marker = event.currentTarget;
  tooltip.replaceChildren(
    document.getElementById(marker.dataset.tooltip).content.cloneNode(true)
  );
  tooltip.hidden = false;
  tooltip.scrollTop = 0;
  const anchor = marker.getBoundingClientRect();
  const left = Math.max(12, Math.min(anchor.left, innerWidth - tooltip.offsetWidth - 12));
  const top = anchor.bottom + 8 + tooltip.offsetHeight <= innerHeight - 12
    ? anchor.bottom + 8 : Math.max(12, anchor.top - tooltip.offsetHeight - 8);
  tooltip.style.left = left + "px";
  tooltip.style.top = top + "px";
}
for (const marker of document.querySelectorAll("[data-tooltip]")) {
  marker.addEventListener("mouseenter", show);
  marker.addEventListener("focus", show);
  marker.addEventListener("click", show);
  marker.addEventListener("mouseleave", delayHide);
  marker.addEventListener("blur", delayHide);
}
tooltip.addEventListener("mouseenter", () => clearTimeout(hideTimer));
tooltip.addEventListener("mouseleave", delayHide);
tooltip.addEventListener("focus", () => clearTimeout(hideTimer));
tooltip.addEventListener("blur", delayHide);
document.addEventListener("keydown", event => { if (event.key === "Escape") hide(); });
document.addEventListener("click", event => {
  if (!event.target.closest("[data-tooltip], #tooltip")) hide();
});
document.querySelector(".chart").addEventListener("scroll", hide);
window.addEventListener("resize", hide);
window.addEventListener("scroll", hide);
</script>
