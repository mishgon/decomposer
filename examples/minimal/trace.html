<hr />
<h3>Раздел 1. Python</h3>
<p><strong>Вопрос 1.</strong> Как Python определяет блоки кода?<br />
A) Символы фигурных скобок <code>{}</code><br />
B) Специальные ключевые слова<br />
C) Отступы (ввода)<br />
D) Символы двоеточия <code>:</code></p>
<p><strong>Правильный ответ: C</strong><br />
Объяснение: В Python используется индентация для разделения блоков кода.</p>
<p><strong>Вопрос 2.</strong> Результат выполнения: <code>print([1, 2, 3][1])</code>?<br />
A) 1<br />
B) 2<br />
C) Error<br />
D) Список</p>
<p><strong>Правильный ответ: B</strong><br />
Объяснение: Индекс 1 выбирает второй элемент списка.</p>
<p><strong>Вопрос 3.</strong> Почему возникает ошибка <code>NameError: name 'x' is not defined</code>?<br />
A) Переменная <code>x</code> не была объявлена ранее<br />
B) Переменная <code>x</code> имеет неверный тип<br />
C) Переменная <code>x</code> слишком длинная<br />
D) Синтаксическая ошибка в коде</p>
<p><strong>Правильный ответ: A</strong><br />
Объяснение: Интерпретатор не может найти имя переменной в памяти.</p>
<hr />
<h3>Раздел 2. SQL</h3>
<p><strong>Вопрос 4.</strong> Что такое SQL JOIN?<br />
A) Создание новой таблицы<br />
B) Объединение данных из нескольких таблиц<br />
C) Удаление записей из базы<br />
D) Сортировка результата</p>
<p><strong>Правильный ответ: B</strong><br />
Объяснение: JOIN используется для соединения строк из двух или более таблиц по условию связи.</p>
<p><strong>Вопрос 5.</strong> Что выведет запрос <code>SELECT name FROM students WHERE age &gt; 18</code>?<br />
A) Счёт всех студентов<br />
B) Имена студентов старше 18 лет<br />
C) Список всех студентов без условий<br />
D) Ошибку компиляции</p>
<p><strong>Правильный ответ: B</strong><br />
Объяснение: Запрос выбирает только имена, соответствующие условию фильтра по возрасту.</p>
<p><strong>Вопрос 6.</strong> Какая строка содержит типичную ошибку синтаксиса?<br />
A) <code>SELECT * FROM users WHERE name = 'Иван'</code><br />
B) <code>SELECT * FROM users WHERE name == 'Иван'</code><br />
C) <code>SELECT name FROM users</code><br />
D) <code>SELECT * FROM users ORDER BY name</code></p>
<p><strong>Правильный ответ: B</strong><br />
Объяснение: В SQL для сравнения используется оператор равенства <code>=</code>, а не <code>==</code>.</p>
<hr />
<h3>Раздел 3. Машинное обучение</h3>
<p><strong>Вопрос 7.</strong> Что такое машинное обучение?<br />
A) Написание сложных алгоритмов вручную<br />
B) Обучение компьютеров на основе данных<br />
C) Создание роботов, похожих на людей<br />
D) Автоматическая замена программистов</p>
<p><strong>Правильный ответ: B</strong><br />
Объяснение: ML — это область ИИ, где алгоритмы улучшают свои навыки через опыт работы с данными.</p>
<p><strong>Вопрос 8.</strong> Фильтр спама помечает письма «Спам» или «Не спам». Как он работает?<br />
A) Система блокирует все письма с ключевыми словами<br />
B) Система учится различать письма по истории<br />
C) Пользователь вручную удаляет подозрительные письма<br />
D) Компьютер генерирует случайные ответы</p>
<p><strong>Правильный ответ: B</strong><br />
Объяснение: Модель анализирует примеры, выявляя закономерности, а не просто следуя жёстким правилам.</p>
<p><strong>Вопрос 9.</strong> Что такое переобучение модели?<br />
A) Модель слишком проста и не учится<br />
B) Модель запоминает тренировочные данные наизусть<br />
C) Модель работает слишком медленно<br />
D) Данные слишком велики для компьютера</p>
<p><strong>Правильный ответ: B</strong><br />
Объяснение: Переобучение означает низкую способность модели обобщать знания на новые данные.</p>

<script>
const tooltip = document.getElementById("tooltip");
let hideTimer;
function hide() { tooltip.hidden = true; }
function delayHide() { hideTimer = setTimeout(hide, 180); }
function show(event) {
  clearTimeout(hideTimer);
  const marker = event.currentTarget;
  tooltip.replaceChildren(
    document.getElementById(marker.dataset.tooltip).content.cloneNode(true)
  );
  tooltip.hidden = false;
  tooltip.scrollTop = 0;
  const anchor = marker.getBoundingClientRect();
  const left = Math.max(12, Math.min(anchor.left, innerWidth - tooltip.offsetWidth - 12));
  const top = anchor.bottom + 8 + tooltip.offsetHeight <= innerHeight - 12
    ? anchor.bottom + 8 : Math.max(12, anchor.top - tooltip.offsetHeight - 8);
  tooltip.style.left = left + "px";
  tooltip.style.top = top + "px";
}
for (const marker of document.querySelectorAll("[data-tooltip]")) {
  marker.addEventListener("mouseenter", show);
  marker.addEventListener("focus", show);
  marker.addEventListener("click", show);
  marker.addEventListener("mouseleave", delayHide);
  marker.addEventListener("blur", delayHide);
}
tooltip.addEventListener("mouseenter", () => clearTimeout(hideTimer));
tooltip.addEventListener("mouseleave", delayHide);
tooltip.addEventListener("focus", () => clearTimeout(hideTimer));
tooltip.addEventListener("blur", delayHide);
document.addEventListener("keydown", event => { if (event.key === "Escape") hide(); });
document.addEventListener("click", event => {
  if (!event.target.closest("[data-tooltip], #tooltip")) hide();
});
document.querySelector(".chart").addEventListener("scroll", hide);
window.addEventListener("resize", hide);
window.addEventListener("scroll", hide);
</script>
