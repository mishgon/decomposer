  version: v3-tau2-workplace-toolathlon-wideseek-20261008

# No subagent_types: each record keeps its gym's own tool schemas and agent
# types. No prompt profile: the student trains with the teacher prompt. The
# release holds no token counts; training decides about long records.
policy:
  id: decomposer-default

# Every source has the Qwen3.8-Flash non-thinking manager (FP8 for tau2, NVFP4
# for Workplace, NVFP4 then FP8 from 2026-10-08 on Toolathlon and WideSeek) with
# Qwen3.5-4B-unlooped thinking subagents.
sources:
  # tau2 broad_v1 pool, rerun 2026-10-07/08 on the FP8 teacher after the
  # decision that only subagents get the domain policy; the manager gets only
  # the user's request. One rollout per task.
  - id: tau2-qwen38-flash-fp8-nonthinking-broad-v1-n1
    adapter: nemo_gym
    snapshot: sha256:170d2e3dcaf52c9cc904e597a105af10edf5db58fa6da80380464ca900d674d8
    benchmark: tau2_gym
    environment: tau2_gym
    partition: train
    teacher: qwen38-flash-non-thinking
    expected_native_rollouts: 4843
    expected_candidates: 4843
  # Workplace train split (2026-10-06), one rollout per task.
  - id: workplace-qwen38-flash-nonthinking-train-n1
