# LoRA on release 1.0.0 of decomposer-manager-sft (tau2, Workplace, Toolathlon,
# WideSeek; the records of v3) for the non-thinking Qwen3.5-4B unloop student. It
# uses the best cell of the 32K v3 LoRA grid (learning rate 2e-4, global batch 8)
# and the H200 benchmark recipe (docs/sft_qwen35_h200_benchmark.md, Recommended
# Configurations), and evaluates every 0.2 epoch. Records over 32K tokens are cut
# from the end. Launch with sft/train_qwen35_h200.sh.
model:
  name_or_path: /mnt/share14T-2/sukhorukov/decomposer_artifacts/models/qwen35_4b_original_unloop/checkpoint-0
  dtype: bfloat16
  attn_implementation: kernels-community/flash-attn3@3c1451f803c146c54222305a8c350f7f46bb5135
  trust_remote_code: false
  qwen35_native_gva: true

data:
  train_file: /mnt/share14T-2/sukhorukov/decomposer_artifacts/datasets/sft/decomposer-manager-sft/1.0.0/train.jsonl
  validation_file: /mnt/share14T-2/sukhorukov/decomposer_artifacts/datasets/sft/decomposer-manager-sft/1.0.0/validation.jsonl
  manifest_file: /mnt/share14T-2/sukhorukov/decomposer_artifacts/datasets/sft/decomposer-manager-sft/1.0.0/manifest.json
  expected_fingerprint: fb6d86f62061f540947636fb5706832542e4ce73577e26f0e6b87df1c0a25556
  expected_system_prompt_profile: teacher
  include_reasoning: false
  num_proc: 8
  max_train_samples: null
  max_eval_samples: null

training:
  output_dir: /mnt/share14T-2/sukhorukov/decomposer_artifacts/training/sft/checkpoints/qwen35-4b-unloop-nonthinking-manager-sft-1.0.0-lora-32k
  run_name: qwen35-4b-unloop-nonthinking-manager-sft-1.0.0-lora-32k
  max_length: 32768
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 1
  global_batch_size: 8
  train_sampling_strategy: group_by_length
  length_column_name: _token_length
  num_train_epochs: 3
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  weight_decay: 0.1
  max_grad_norm: 1.0
  optim: adamw_torch_fused
  loss_type: chunked_nll
  use_liger_kernel: true
  liger_kernel_config:
    fused_linear_cross_entropy: true
    cross_entropy: false
    rms_norm: true
    swiglu: true
    rope: false
  bf16: true
  tf32: true
  use_cache: false
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false
  packing: false
  # 0.2 epoch: the 3,797 training records make 475 steps per epoch at global
  # batch 8. Early stopping needs a checkpoint at every evaluation.
  eval_strategy: steps
  eval_steps: 95
  save_strategy: steps
  save_steps: 95
  save_total_limit: 2
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
  greater_is_better: false
  # A resumed run keeps its early-stopping count.
  restore_callback_states_from_checkpoint: true
  logging_strategy: steps
  logging_steps: 1
  logging_first_step: true
  include_num_input_tokens_seen: true
  prediction_loss_only: true
  seed: 42
  data_seed: 42
  dataloader_num_workers: 4
  dataloader_pin_memory: true
  fsdp: false
  ddp_find_unused_parameters: false

lora:
  r: 32
  alpha: 64
  dropout: 0.05

clearml:
  enabled: true
  weight_norm_interval_steps: 10
  project: decomposer
  task: Qwen3.5-4B unloop LoRA SFT decomposer-manager-sft 1.0.0 32K
  tags:
    - sft
    - lora
    - qwen3.5-4b-unloop
    - decomposer-manager-sft-1.0.0
    - 32k
  log_model: false
  output_uri: null

run:
  expected_world_size: 4
  required_runtime_profile: null
  disable_cudnn_sdpa: true
  resume_from_checkpoint: null
  overwrite_output_dir: false
  early_stopping:
    patience: 3
    threshold: 0.0
