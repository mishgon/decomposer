data:
  train_file: /home/sukhorukov/decomposer_artifacts/datasets/sft/decomposer-mixed-deepseek-gemma4-nonthinking/v3-wp-effort-max-pooled-1152-tool-b97bced8-newest-pass-or-qge90-32k/train.jsonl
  validation_file: /home/sukhorukov/decomposer_artifacts/datasets/sft/decomposer-mixed-deepseek-gemma4-nonthinking/v3-wp-effort-max-pooled-1152-tool-b97bced8-newest-pass-or-qge90-32k/validation.jsonl
  manifest_file: /home/sukhorukov/decomposer_artifacts/datasets/sft/decomposer-mixed-deepseek-gemma4-nonthinking/v3-wp-effort-max-pooled-1152-tool-b97bced8-newest-pass-or-qge90-32k/manifest.json
  include_reasoning: false
  expected_system_prompt_profile: teacher
  error_on_truncation: true
  # Drop any trace beyond the 32K envelope rather than truncating it.
  exclude_overlength: true
  num_proc: 8
  max_train_samples: null
  max_eval_samples: null

training:
  output_dir: /mnt/share14T-2/sukhorukov/decomposer_artifacts/training/sft/checkpoints/gemma4-26b-a4b-nonthinking-4gpu-mixed-v3
  run_name: gemma4-26b-a4b-nonthinking-4gpu-mixed-v3
  max_length: 32768
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  # Global batch four derives accumulation one, avoiding unsynchronized FSDP
  # gradients and leaving room for Liger's fused-CE weight-gradient accumulator.
  global_batch_size: 4
  num_train_epochs: 5
  # Linear scaling approximately preserves the per-example update magnitude
  # after halving the global batch from eight to four.
  learning_rate: 1.0e-5
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  weight_decay: 0.1
  max_grad_norm: 1.0
  optim: adamw_torch_fused
  loss_type: chunked_nll
  use_liger_kernel: true
  liger_kernel_config:
    fused_linear_cross_entropy: true
    cross_entropy: false
    rms_norm: false
    geglu: false
    rope: false
    layer_norm: false
  bf16: true
  tf32: true
  use_cache: false
  gradient_checkpointing: false
  packing: false
  eval_strategy: epoch
  save_strategy: epoch
  save_total_limit: 2
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
  greater_is_better: false
  logging_strategy: steps
  logging_steps: 1
  logging_first_step: true
  include_num_input_tokens_seen: true
  prediction_loss_only: true
  seed: 42
  data_seed: 42
  dataloader_num_workers: 4
  dataloader_pin_memory: true
  fsdp: true
  fsdp_config:
    auto_wrap_policy: TRANSFORMER_BASED_WRAP
    # gemma-4 ships a shared _no_split_modules listing Gemma4AudioLayer, but the
    # 26B-A4B checkpoint has audio_config: null and instantiates no audio tower,
    # so the default wrap set fails to resolve. Name the classes that exist.
    transformer_layer_cls_to_wrap:
      - Gemma4TextDecoderLayer
      - Gemma4VisionEncoderLayer
      - Gemma4VisionPatchEmbedder
    reshard_after_forward: true
    cpu_offload: false
    activation_checkpointing: true
    state_dict_type: SHARDED_STATE_DICT
    cpu_ram_efficient_loading: false
    sync_module_states: true

clearml:
  enabled: false
  weight_norm_interval_steps: 10
  project: decomposer
  task: google/gemma-4-26B-A4B-it Decomposer SFT non-thinking mixed v1
  tags:
    - sft
    - gemma-4-26B-A4B-it
    - workplace-assistant
    - toolathlon-gym
  log_model: false
  output_uri: null

run:
  expected_world_size: 4
  disable_cudnn_sdpa: true
  resume_from_checkpoint: null
  overwrite_output_dir: false
  early_stopping:
    patience: 1
    threshold: 0.0
