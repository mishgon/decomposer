defaults:
  - ppo_trainer
  - _self_

hydra:
  searchpath:
    - pkg://verl.trainer.config

algorithm:
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: false

data:
  train_files: ${oc.env:RL_DATA}/train.parquet
  val_files: ${oc.env:RL_DATA}/validation.parquet
  return_raw_chat: true
  train_batch_size: 2
  val_batch_size: 8
  max_prompt_length: 4096
  max_response_length: 12288
  apply_chat_template_kwargs:
    enable_thinking: false

actor_rollout_ref:
  model:
    path: ${oc.env:MODEL_PATH}
    lora_rank: 16
    lora_alpha: 32
    target_modules: all-linear
    override_config:
      attn_implementation: sdpa
    use_remove_padding: false
  actor:
    optim:
      lr: 1.0e-5
    ppo_mini_batch_size: 2
    ppo_micro_batch_size_per_gpu: 1
    use_dynamic_bsz: false
    loss_agg_mode: seq-mean-token-mean
    checkpoint:
      save_contents: [model, optimizer, extra]
  ref:
    log_prob_micro_batch_size_per_gpu: 1
  rollout:
    name: vllm
    mode: async
    tensor_model_parallel_size: 1
    gpu_memory_utilization: 0.45
    n: 4
    temperature: 0.7
    top_p: 0.8
    top_k: 20
    calculate_log_probs: true
    log_prob_micro_batch_size_per_gpu: 1
    enforce_eager: true
    enable_prefix_caching: false
    load_format: safetensors
    engine_kwargs:
      vllm:
        additional_config:
          gdn_prefill_backend: triton
    agent:
      agent_loop_config_path: ${oc.env:RL_ROOT}/training/toolathlon_gym/agent_loop.yaml
      default_agent_loop: toolathlon_decomposer
      num_workers: 2
    val_kwargs:
      n: 3
      do_sample: true
      temperature: 0.7
      top_p: 0.8
      top_k: 20

trainer:
  use_v1: true
  n_gpus_per_node: 1
  nnodes: 1
  total_training_steps: 8
  save_freq: 2
  test_freq: 2
  val_before_train: true
  default_local_dir: ${oc.env:RL_ARTIFACTS}/checkpoints
  project_name: decomposer-toolathlon-gym
  experiment_name: pilot
  logger: [console, tensorboard]
