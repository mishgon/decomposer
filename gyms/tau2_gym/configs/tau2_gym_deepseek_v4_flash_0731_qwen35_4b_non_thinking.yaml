responses_create_params:
  temperature: 1.0
  top_p: 1.0

# Resolved from NEMO_GYM_EXTRA_ROOTS=gyms/tau2_gym/gym_components, which is searched
# before the built-in Gym tree (nemo_gym/__init__.py:52-79). No submodule edits.
tau2_gym:
  resources_servers:
    tau2_gym:
      entrypoint: app.py
      domain: agent
      verified: false
      description: tau2 GAIA2-hard domains as a multi-step tool-using environment.
      value: Improve multi-step tool use and task decomposition.
      language: en

policy_model:
  responses_api_models:
    openai_model:
      entrypoint: app.py
      openai_base_url: https://openrouter.ai/api/v1
      openai_api_key: ${policy_api_key}
      openai_model: deepseek/deepseek-v4-flash-0731
      extra_body:
        reasoning:
          effort: max

decomposer:
  responses_api_agents:
    decomposer_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: tau2_gym
      model_server:
        type: responses_api_models
        name: policy_model
      join_gym_system_and_user_prompts: true
      decomposer_system_prompt_profile: teacher
      response_for_verifier_factory: responses_api_agents.decomposer_agent.app:_subagent_tool_calls_and_final_message
      subagent_types:
        - subagent_type_id: qwen35_4b_non_thinking
          assistant_id: qwen35_4b_non_thinking
          url: http://127.0.0.1:2024
          description: General-purpose tool-calling agent with access to the environment tools.
