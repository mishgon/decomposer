responses_create_params:
  temperature: 1.0
  top_p: 0.95

workplace_assistant:
  resources_servers:
    workplace_assistant:
      entrypoint: app.py
      domain: agent
      verified: false
      description: Workplace assistant multi-step tool-using environment.
      value: Improve multi-step tool use capability.

policy_model:
  responses_api_models:
    openai_model:
      entrypoint: app.py
      openai_base_url: https://openrouter.ai/api/v1
      openai_api_key: ${policy_api_key}
      openai_model: z-ai/glm-5.2
      extra_body:
        reasoning:
          effort: high

decomposer:
  responses_api_agents:
    decomposer_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: workplace_assistant
      model_server:
        type: responses_api_models
        name: policy_model
      join_gym_system_and_user_prompts: true
      decomposer_system_prompt_profile: student
      response_for_verifier_factory: responses_api_agents.decomposer_agent.app:_subagent_tool_calls_and_final_message
      subagent_types:
        - subagent_type_id: gemma_4_2b_thinking
          assistant_id: gemma_4_2b_thinking
          url: http://127.0.0.1:2024
          description: Gemma-4-E2B workplace agent with thinking enabled.
        - subagent_type_id: gemma_4_2b_non_thinking
          assistant_id: gemma_4_2b_non_thinking
          url: http://127.0.0.1:2024
          description: Gemma-4-E2B workplace agent with thinking disabled.
        - subagent_type_id: gemma_4_4b_thinking
          assistant_id: gemma_4_4b_thinking
          url: http://127.0.0.1:2024
          description: Gemma-4-E4B workplace agent with thinking enabled.
        - subagent_type_id: gemma_4_4b_non_thinking
          assistant_id: gemma_4_4b_non_thinking
          url: http://127.0.0.1:2024
          description: Gemma-4-E4B workplace agent with thinking disabled.
        - subagent_type_id: gemma_4_12b_thinking
          assistant_id: gemma_4_12b_thinking
          url: http://127.0.0.1:2024
          description: Gemma-4-12B workplace agent with thinking enabled.
        - subagent_type_id: gemma_4_12b_non_thinking
          assistant_id: gemma_4_12b_non_thinking
          url: http://127.0.0.1:2024
          description: Gemma-4-12B workplace agent with thinking disabled.
        - subagent_type_id: gemma_4_26b_a4b_thinking
          assistant_id: gemma_4_26b_a4b_thinking
          url: http://127.0.0.1:2024
          description: Gemma-4-26B-A4B workplace agent with thinking enabled.
        - subagent_type_id: gemma_4_26b_a4b_non_thinking
          assistant_id: gemma_4_26b_a4b_non_thinking
          url: http://127.0.0.1:2024
          description: Gemma-4-26B-A4B workplace agent with thinking disabled.
