responses_create_params:
  temperature: 1.0
  top_p: 0.95

workplace_assistant:
  resources_servers:
    workplace_assistant:
      entrypoint: app.py
      domain: agent
      verified: false
      description: Workplace assistant multi-step tool-using environment.
      value: Improve multi-step tool use capability.

policy_model:
  responses_api_models:
    vllm_model:
      entrypoint: app.py
      base_url: http://127.0.0.1:8023/v1
      api_key: EMPTY
      model: google/gemma-4-26B-A4B-it
      return_token_id_information: false
      uses_reasoning_parser: true
      chat_template_kwargs:
        enable_thinking: true
        preserve_thinking: true
      extra_body:
        top_k: 64
        include_reasoning: true

decomposer:
  responses_api_agents:
    decomposer_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: workplace_assistant
      model_server:
        type: responses_api_models
        name: policy_model
      join_gym_system_and_user_prompts: true
      decomposer_system_prompt_profile: teacher
      response_for_verifier_factory: responses_api_agents.decomposer_agent.app:_subagent_tool_calls_and_final_message
      subagent_types:
        - subagent_type_id: gemma_4_26b_a4b_non_thinking
          assistant_id: gemma_4_26b_a4b_non_thinking
          url: http://127.0.0.1:2024
          description: Gemma-4-26B-A4B workplace agent with thinking disabled.
