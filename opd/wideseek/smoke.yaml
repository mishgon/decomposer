# One optimizer update to verify execution, checkpoints and logging.
defaults:
  - full
  - _self_
trainer:
  experiment_name: smoke
  val_before_train: false
  # Keep full's positive interval: -1 skips veRL's final metrics flush.
rollout:
  total_rollout_steps: 1
async_training:
  concurrent_samples_per_replica: 1
